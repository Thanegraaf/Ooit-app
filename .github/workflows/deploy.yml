# Zet de app online op GitHub Pages.
# Vult config.js met de Supabase-gegevens uit de repository secrets,
# zodat je die sleutels op één plek beheert.
name: Deploy naar GitHub Pages

on:
  push:
    branches: ['**']
    paths-ignore:
      - '.github/heartbeat.txt'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Alleen de standaardbranch gaat live.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Supabase-gegevens invullen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Haalt onzichtbare tekens weg die vaak per ongeluk meekomen bij
          # het plakken van een secret: regeleindes en spaties aan het begin
          # of einde. Zonder deze stap kan zo'n teken de app al laten
          # struikelen voordat er verbinding met Supabase wordt gemaakt.
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          SUPABASE_URL="$(trim "${SUPABASE_URL:-}")"
          SUPABASE_KEY="$(trim "${SUPABASE_KEY:-}")"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning title=Supabase nog niet gekoppeld::Maak de secrets SUPABASE_URL en SUPABASE_ANON_KEY aan onder Settings > Secrets and variables > Actions. De app toont nu het scherm 'Nog even koppelen'."
            exit 0
          fi
          case "$SUPABASE_KEY" in
            sb_secret_*|*service_role*|eyJ*ic2VydmljZV9yb2xl*)
              echo "::error title=Verkeerde sleutel::SUPABASE_ANON_KEY lijkt een secret key of service_role key. Die hoort nooit in een app. Gebruik de publishable key (sb_publishable_...) of de legacy anon key."
              exit 1 ;;
          esac
          body=$(jq -cn --arg u "$SUPABASE_URL" --arg k "$SUPABASE_KEY" \
            '{supabaseUrl: ($u | sub("/+$"; "")), supabaseAnonKey: $k}')
          printf 'window.OOIT_CONFIG = %s;\n' "$body" > config.js
          echo "config.js gevuld met de Supabase-gegevens uit de secrets."

          # Controle zonder de geheime waarden zelf te tonen: alleen lengte,
          # vorm en de aanwezigheid van rare tekens. Helpt bij het opsporen
          # van een verkeerd gekopieerde URL of sleutel.
          node -e '
            const u = process.env.SUPABASE_URL, k = process.env.SUPABASE_KEY;
            const weird = s => [...s].some(c => c.codePointAt(0) < 32 || c.codePointAt(0) === 127);
            console.log("URL lengte: " + u.length + ", bevat onzichtbare tekens: " + weird(u));
            console.log("KEY lengte: " + k.length + ", bevat onzichtbare tekens: " + weird(k));
            try { const p = new URL(u); console.log("URL is geldig volgens de browserregels, host: " + p.host); }
            catch(e) { console.log("URL is NIET geldig volgens de browserregels: " + e.message); }
            console.log("KEY begint met sb_publishable_: " + k.startsWith("sb_publishable_"));
            console.log("KEY ziet eruit als een JWT (drie delen met punten): " + (k.split(".").length === 3));
          '

      - name: Cache-versie op deze commit zetten
        run: |
          set -euo pipefail
          sed -i "s|^const VERSION = .*|const VERSION = 'ooit-${GITHUB_SHA:0:7}';|" sw.js
          grep -n "^const VERSION" sw.js

      # Vereist dat Pages aanstaat met GitHub Actions als bron.
      # Zie stap 6 in de README.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
